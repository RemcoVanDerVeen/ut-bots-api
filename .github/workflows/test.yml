name: Test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_call:

env:
  DATABASE_URL: "postgres://postgres:postgres@localhost:5432/ut_bots_test"
  RUBY_VERSION: 3.4.7
  RAILS_ENV: test
  TZ: Europe/Amsterdam
  BUNDLE_WITHOUT: production
  BUNDLE_DEPLOYMENT: false

jobs:
  # bundle-audit:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4

  #     - name: Set up Ruby
  #       uses: ruby/setup-ruby@v1
  #       with:
  #         ruby-version: ${{ env.RUBY_VERSION }}
  #         bundler-cache: true

  #     - name: Run bundle audit
  #       # uri gem cannot be updated in current production OS
  #       run: |
  #         bundle exec bundle audit check --update --ignore CVE-2023-26141 CVE-2023-28755 CVE-2023-36617 CVE-2025-27111

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{env.RUBY_VERSION}}
          bundler-cache: true

      - name: Run rubocop
        run: bundle exec rubocop

  herb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{env.RUBY_VERSION}}
          bundler-cache: true

      - name: Run Herb Linter
        run: bundle exec herb analyze .

  # brakeman:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4

  #     - name: Set up Ruby
  #       uses: ruby/setup-ruby@v1
  #       with:
  #         ruby-version: ${{env.RUBY_VERSION}}
  #         bundler-cache: true

  #     - name: Run brakeman
  #       run: bundle exec brakeman

  minitest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ut_bots_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options:
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Create DB
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      - name: Run Minitest
        run: |
          bundle exec rails test
